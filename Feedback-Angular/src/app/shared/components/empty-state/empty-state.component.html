
    <div class="flex flex-col items-center justify-center py-16 px-6 text-center">
      <div class="mb-5 relative">
        <div class="w-20 h-20 rounded-2xl bg-surface-50 border-2 border-dashed border-surface-200 flex items-center justify-center">

          @switch (type()) {
            @case ('surveys') {
              <svg class="w-9 h-9 text-surface-300" viewBox="0 0 40 40" fill="none">
                <rect x="4" y="4" width="32" height="32" rx="4" stroke="currentColor" stroke-width="2"/>
                <path d="M12 14h16M12 20h12M12 26h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <circle cx="30" cy="30" r="7" fill="#4f46e5"/>
                <path d="M27 30l2 2 4-4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            }
            @case ('responses') {
              <svg class="w-9 h-9 text-surface-300" viewBox="0 0 40 40" fill="none">
                <path d="M6 8a2 2 0 012-2h24a2 2 0 012 2v18a2 2 0 01-2 2H14l-8 6V8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M13 16h14M13 21h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            }
            @case ('analytics') {
              <svg class="w-9 h-9 text-surface-300" viewBox="0 0 40 40" fill="none">
                <rect x="4"  y="28" width="7" height="8"  rx="1.5" fill="currentColor" opacity=".3"/>
                <rect x="14" y="20" width="7" height="16" rx="1.5" fill="currentColor" opacity=".5"/>
                <rect x="24" y="12" width="7" height="24" rx="1.5" fill="currentColor" opacity=".7"/>
                <rect x="34" y="4"  width="2" height="32" rx="1"   fill="currentColor" opacity=".15"/>
                <path d="M4 36h32" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".3"/>
              </svg>
            }
            @case ('users') {
              <svg class="w-9 h-9 text-surface-300" viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="14" r="6" stroke="currentColor" stroke-width="2"/>
                <path d="M6 34c0-7.732 6.268-14 14-14s14 6.268 14 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            }
            @case ('questions') {
              <svg class="w-9 h-9 text-surface-300" viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="20" r="16" stroke="currentColor" stroke-width="2"/>
                <path d="M16 16.5a4 4 0 017.46 2c0 2.5-3.46 3-3.46 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <circle cx="20" cy="27" r="1.5" fill="currentColor"/>
              </svg>
            }
          }

        </div>
        <div class="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-brand-100 border-2 border-white"></div>
        <div class="absolute -bottom-1 -left-1 w-2 h-2 rounded-full bg-surface-200 border-2 border-white"></div>
      </div>

      <h3 class="text-base font-semibold text-surface-800 mb-1.5">{{ config().title }}</h3>
      <p class="text-sm text-surface-400 max-w-xs leading-relaxed">{{ config().subtitle }}</p>

      @if (config().actionLabel && config().actionRoute) {
        <a [routerLink]="config().actionRoute" class="btn-primary mt-5">
          {{ config().actionLabel }}
        </a>
      }
    </div>
